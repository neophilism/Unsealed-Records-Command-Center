name: BFF product and identity tests
on:
  pull_request:
  push:
    branches: [main, boardroom/URC-02]
permissions:
  contents: read
jobs:
  bff-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify BFF identity, consent scope and server-side proxy boundaries
        run: node --test tests/bff-*.test.mjs
